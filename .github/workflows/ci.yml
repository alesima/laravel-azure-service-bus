name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3']
        laravel: ['10.*', '11.*']
        exclude:
          # Laravel 11 requires PHP ^8.2.
          - php: '8.1'
            laravel: '11.*'
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, json, intl, dom, curl
          coverage: none
      - name: Pin Laravel version
        run: |
          composer require --no-update --no-interaction \
            "illuminate/container:${{ matrix.laravel }}" \
            "illuminate/support:${{ matrix.laravel }}" \
            "illuminate/encryption:${{ matrix.laravel }}" \
            "illuminate/queue:${{ matrix.laravel }}"
      - name: Install dependencies
        uses: ramsey/composer-install@v3
        with:
          composer-options: --prefer-dist --no-progress
      - name: Validate composer
        run: composer validate --strict
      - name: Lint
        run: vendor/bin/phpcs --standard=.phpcs.xml src tests config
      - name: PHPStan
        run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress
      - name: PHPUnit
        run: vendor/bin/phpunit --no-coverage

  coverage:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, json, intl, dom, curl
          coverage: pcov
      - name: Pin Laravel version
        run: |
          composer require --no-update --no-interaction \
            "illuminate/container:11.*" \
            "illuminate/support:11.*" \
            "illuminate/encryption:11.*" \
            "illuminate/queue:11.*"
      - name: Install dependencies
        uses: ramsey/composer-install@v3
        with:
          composer-options: --prefer-dist --no-progress
      - name: PHPUnit with coverage
        run: |
          mkdir -p build/logs
          vendor/bin/phpunit --coverage-clover=build/logs/clover.xml
      - name: Upload to Coveralls
        if: github.event_name == 'push'
        run: vendor/bin/php-coveralls --coverage_clover=build/logs/clover.xml -v
        env:
          COVERALLS_REPO_TOKEN: ${{ secrets.COVERALLS_REPO_TOKEN }}
